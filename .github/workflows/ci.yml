name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Engine suite (${{ matrix.os }})
    # Three OSes, always. The engine ships to users on macOS, Linux and
    # Windows, and the platform differences that bite are the ones CI never
    # ran: path separators, a filename that is legal on one and not the
    # other, and UTF-8 output under a legacy console. A Linux-only gate
    # catches none of them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The engine is a package under engine/, not installed; run_tests.py
      # bootstraps this itself, but `python -m executor` does not.
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Entry point (python -m executor)
        # Proves the package runs as a module on this platform, not just
        # when its test runner imports it.
        run: python -m executor --version
      - name: Suite at 100% branch coverage
        # run_tests.py is the only entry point: it runs the suite AND
        # enforces the fail_under=100 branch floor from pyproject.toml. A
        # green suite below 100% fails this step by design.
        run: python scripts/run_tests.py

  contract:
    name: Skill contract and prompt lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill files, registry, payload shapes, refusals
        # validate_skills.py checks frontmatter, the dispatch registry,
        # that no prompt teaches a second markdown renderer, that every
        # payload-writing prompt states the refusal contract, and that no
        # ID example or JSON skeleton teaches something the engine rejects.
        run: python scripts/validate_skills.py
      - name: Prompt-injection lint
        # Every SKILL.md is executed as instruction by agents. This blocks
        # override directives, concealment, exfiltration endpoints,
        # fetch-and-execute, and credential literals from entering main.
        run: python scripts/lint-prompt-injection.py skills/

  secret-scan:
    name: Secret scan (both stores)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The engine's own scanner finds nothing in a store it just wrote
        # Not a lint of this file: this runs the shipped `executor check
        # --secrets` against a real initiative, so the scanner that users
        # depend on is exercised here, and it must report no findings.
        run: |
          set -e
          git config user.email ci@example.com
          git config user.name ci
          python -m executor new "ci secret-scan smoke"
          python -m executor check --secrets
      - name: Gitleaks (defense in depth, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
